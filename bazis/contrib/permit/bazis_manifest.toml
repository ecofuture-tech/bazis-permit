# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-permit"
summary = "permissions of users on objects, fields and relations, by roles"
solves = [
    "users see and change only their own or their organization's objects",
    "users see the objects they take part in: a many-to-many or reverse relation to the user (participants, members)",
    "roles and groups of permissions declared in the code (roles.py) and applied by migrate, or managed in the admin or the API",
    "hide or protect fields per user",
    "restrict which objects a relation may reference",
]
requires = ["bazis", "bazis-users"]
pairs_well = ["bazis-author", "bazis-statusy"]

[[extension_points]]
name = "PermitRouteBase"
import = "bazis.contrib.permit.routes_abstract.PermitRouteBase"
use_when = "every route of a model protected by permissions"

[[extension_points]]
name = "PermitRouteBase.route_run"
import = "bazis.contrib.permit.routes_abstract.PermitRouteBase"
use_when = "a custom action of a protected model: access_action= (the permission), public=True (anyone), public=False (any authenticated user) (Custom actions)"

[[extension_points]]
name = "PermitRouteBase.custom_actions"
import = "bazis.contrib.permit.routes_abstract.PermitRouteBase"
use_when = "show a client which custom actions the user may call: ?meta=custom_actions; an operation of its own is an AccessAction subclass"

[[extension_points]]
name = "PermitModelMixin"
import = "bazis.contrib.permit.models_abstract.PermitModelMixin"
use_when = "a model protected by permissions (selectors)"

[[extension_points]]
name = "UserPermitMixin"
import = "bazis.contrib.permit.models_abstract.UserPermitMixin"
use_when = "the user model: roles and the current role"

[[extension_points]]
name = "AnonymousUserPermitMixin"
import = "bazis.contrib.permit.models_abstract.AnonymousUserPermitMixin"
use_when = "the anonymous user model: the roles for anonymous users"

[[extension_points]]
name = "Group"
import = "bazis.contrib.permit.declare.Group"
use_when = "a permission group declared in the GROUPS of <app>/roles.py, applied by migrate"

[[extension_points]]
name = "Role"
import = "bazis.contrib.permit.declare.Role"
use_when = "a role declared in the ROLES of <app>/roles.py, applied by migrate"

[[extension_points]]
name = "PermitSelectorMixin"
import = "bazis.contrib.permit.models_abstract.PermitSelectorMixin"
use_when = "a model that is a selector source: the user model (for `author`), an organization"

[[pitfalls]]
text = "BAZIS_PERMIT_RELATIONS_VIEW_CHECK is deprecated and has no effect"
check = "permit.W001"

[[pitfalls]]
text = "a JSON:API route that neither inherits PermitRouteBase nor overrides restrict_queryset serves its whole model; permit_public = True only for public data"
check = "permit.W002"

[[pitfalls]]
text = "the model of a PermitRouteBase route must be a PermitModelMixin"
check = "permit.W003"

[[pitfalls]]
text = "filter, sort and search reach only the fields the field permissions show the user in every object (400 ERR_FILTER otherwise)"

[[pitfalls]]
text = "the routes of an item answer 404 for an item the user cannot view and 403 for one he views but cannot change or delete"

[[pitfalls]]
text = "a custom action without access_action or public is open to every authenticated user"
check = "permit.W007"

[[pitfalls]]
text = "an aggregate or a report with access_action=CrudAccessAction.VIEW is open to every role that views the model, anonymous ones too: give it an AccessAction of its own"
check = "permit.W008"

[[pitfalls]]
text = "`disable` on add or change hides only an optional field: a required one stays in the create and update schemas; fill it on the server or use readonly"
check = "permit.W009"

[[pitfalls]]
text = "QuerySet.update() and bulk_create() on roles, groups and permissions do not invalidate the permission cache"

[[pitfalls]]
text = "a selector names a relation to a PermitSelectorMixin model; any other name matches nothing and is only logged"

[[pitfalls]]
text = "a many-to-many selector with a custom through model needs a unique constraint on its two foreign keys"

[[pitfalls]]
text = "permit_public = True only silences permit.W002, it checks nothing"

[[pitfalls]]
text = "the routes of bazis-users do not check permissions: register a PermitRouteBase route set of the user model to restrict them"
check = "permit.W002"

[[pitfalls]]
text = "the names of Role and GroupPermission are the columns name_en and name_ru: declare English gettext_lazy names in roles.py"

[[pitfalls]]
text = "an invalid slug, a duplicate or an undeclared group of a role in roles.py stops migrate"
check = "permit.E004"

[[pitfalls]]
text = "a declared permission names a PermitModelMixin model, a selector relation and an existing field (a model with statuses: the status segment after the selector)"
check = "permit.E005"

[[pitfalls]]
text = "the declared roles reach the database only by migrate"
check = "permit.W005"

[[pitfalls]]
text = "a managed role or group removed from roles.py is kept: delete it in the admin"
check = "permit.W006"

[[pitfalls]]
text = "to show more objects add a permission with another selector, not a union in restrict_queryset"

[[pitfalls]]
text = "a slug of roles.py that exists unmarked is taken over and synced"

[[pitfalls]]
text = "on a fresh database a data migration cannot rely on the declared roles: they are applied after the last migration"
