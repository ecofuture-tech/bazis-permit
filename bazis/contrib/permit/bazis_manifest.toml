# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-permit"
summary = "permissions of users on objects, fields and relations, by roles"
solves = [
    "users see and change only their own or their organization's objects",
    "users see the objects they take part in: a many-to-many or reverse relation to the user (participants, members)",
    "roles and groups of permissions declared in the code (roles.py) and applied by migrate, or managed in the admin or the API",
    "hide or protect fields per user",
    "restrict which objects a relation may reference",
]
requires = ["bazis", "bazis-users"]
pairs_well = ["bazis-author", "bazis-statusy"]

[[extension_points]]
name = "PermitRouteBase"
import = "bazis.contrib.permit.routes_abstract.PermitRouteBase"
use_when = "every route of a model protected by permissions"

[[extension_points]]
name = "PermitRouteBase.route_run"
import = "bazis.contrib.permit.routes_abstract.PermitRouteBase"
use_when = "a custom action of a protected model (checked in route_check before it runs): access_action=CrudAccessAction.<X> for the permission the roles must give (on the model, or on the item of item_id taken into self.item), public=True for anyone, public=False for any authenticated user"

[[extension_points]]
name = "PermitRouteBase.custom_actions"
import = "bazis.contrib.permit.routes_abstract.PermitRouteBase"
use_when = "show a client which custom actions the user may call: ?meta=custom_actions lists their names (x-bazis action), of an item on an item, of the collection on a list, by the rule route_check enforces (action_allowed); an operation of its own is an AccessAction subclass (REPORT = 'report': the permission <app>.<model>.item.report.<selector>)"

[[extension_points]]
name = "PermitModelMixin"
import = "bazis.contrib.permit.models_abstract.PermitModelMixin"
use_when = "a model protected by permissions (selectors)"

[[extension_points]]
name = "UserPermitMixin"
import = "bazis.contrib.permit.models_abstract.UserPermitMixin"
use_when = "the user model: roles and the current role"

[[extension_points]]
name = "AnonymousUserPermitMixin"
import = "bazis.contrib.permit.models_abstract.AnonymousUserPermitMixin"
use_when = "the anonymous user model: the roles for anonymous users"

[[extension_points]]
name = "Group"
import = "bazis.contrib.permit.declare.Group"
use_when = "a permission group declared in the GROUPS of <app>/roles.py, applied by migrate"

[[extension_points]]
name = "Role"
import = "bazis.contrib.permit.declare.Role"
use_when = "a role declared in the ROLES of <app>/roles.py, applied by migrate"

[[extension_points]]
name = "PermitSelectorMixin"
import = "bazis.contrib.permit.models_abstract.PermitSelectorMixin"
use_when = "a model that is a selector source: the user model (for `author`), an organization"

[[pitfalls]]
text = "BAZIS_PERMIT_RELATIONS_VIEW_CHECK is deprecated and has no effect: the core checks the related objects (relation_targets_check)"
check = "permit.W001"

[[pitfalls]]
text = "a JSON:API route that neither inherits PermitRouteBase nor overrides restrict_queryset (applied in its get_queryset) serves its whole model; permit_public = True only for public data"
check = "permit.W002"

[[pitfalls]]
text = "the model of a PermitRouteBase route must be a PermitModelMixin (PermitStructMixin): otherwise its route, `included` and the filters through a relation into it fail with AttributeError once the user has a permission on it"
check = "permit.W003"

[[pitfalls]]
text = "the filter, sort and search of a request reach the fields the field permissions show the user in some object (Bazis 2.9, PermitRouteBase.query_fields): a field shown in only some objects, or in an object no field permission matches, stays reachable in all of them; hide it in the route `fields` if its values must not be found"

[[pitfalls]]
text = "the routes of an item answer 404 for an item the user cannot view (as for a missing one) and 403 for one he views but cannot change or delete; the lookup of the item (get_queryset_for_item: set_item, get_item) is restricted by restrict_queryset for view in the same query, so a custom action that takes its item with them answers the same; the read of the response after a write is not restricted (a create or an update that makes the item invisible is 403 and rolled back; a statusy transit that hides it answers 204)"

[[pitfalls]]
text = "a custom action (kind other) of a PermitRouteBase: public=True is open to anyone (limited by BAZIS_THROTTLE_PUBLIC per user or IP address); with access_action= the roles decide, also those for anonymous users (on the model for an action of the collection, on the item of item_id, taken into self.item before the action runs, locked for POST, PUT, PATCH and DELETE); with neither only authenticated users (403 for anonymous ones)"

[[pitfalls]]
text = "a custom action of a PermitRouteBase (of the collection or of an item) without access_action or public is open to every authenticated user: declare access_action (e.g. CrudAccessAction.VIEW, restrict_queryset in its code), or public=False if that is intended"
check = "permit.W007"

[[pitfalls]]
text = "QuerySet.update() and bulk_create() on roles, groups and permissions do not invalidate the permission cache"

[[pitfalls]]
text = "a selector names a relation of the model (a foreign key, a many-to-many field or the related_name of a reverse relation) to a PermitSelectorMixin model; any other name matches nothing and is only logged"

[[pitfalls]]
text = "a many-to-many selector with a custom through model needs a unique constraint or index on the two foreign keys of the through model"

[[pitfalls]]
text = "permit_public = True only silences permit.W002: a route that is not a PermitRouteBase serves its get_queryset without permissions whatever it says, and a PermitRouteBase with it still checks them; a route that restricts its objects with its own restrict_queryset (the files of bazis-uploadable, the tasks of bazis-bg) needs no permit_public"

[[pitfalls]]
text = "the routes of bazis-users do not check permissions: to restrict the users, the user model inherits PermitModelMixin and the project registers its own PermitRouteBase route set of it (default_route = True)"
check = "permit.W002"

[[pitfalls]]
text = "the names of Role and GroupPermission are the columns name_en and name_ru whatever the languages of the project: declare the roles in roles.py with English gettext_lazy names, migrate writes the translations of the catalogs of the project into both (`manage.py bazis_messages status` lists the untranslated ones)"

[[pitfalls]]
text = "a declaration of roles.py with an invalid slug, a duplicate or a group of a role that is not declared stops migrate"
check = "permit.E004"

[[pitfalls]]
text = "a declared permission names a PermitModelMixin model, a selector that is a relation to a PermitSelectorMixin model and an existing field; a model with statuses has the status segment after the selector"
check = "permit.E005"

[[pitfalls]]
text = "the declared roles reach the database only by migrate (or flush): after a change of roles.py run migrate; `manage.py bazis_doctor` (bazis 2.13; `manage.py check --database default` with an older core) lists the differences"
check = "permit.W005"

[[pitfalls]]
text = "a managed role or group removed from roles.py is kept, with its permissions: it is an ordinary object in the admin again, delete it there"
check = "permit.W006"

[[pitfalls]]
text = "to show more objects add a permission with another selector, not a union in restrict_queryset (its queryset also carries the field groups of the objects); an override narrows super().restrict_queryset(...)"

[[pitfalls]]
text = "a slug of roles.py that exists unmarked is taken over and synced: its permissions (a group) or managed groups (a role) that are not declared are revoked; a managed group the admin attaches to a declared role is removed by migrate"

[[pitfalls]]
text = "the declarations are applied after the last migration: on a fresh database a data migration cannot rely on the declared roles"
